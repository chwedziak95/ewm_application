############# Secrets ###########################################
# Secret values come from environment variables or from a git-ignored
# secrets.properties next to pom.xml (see secrets.properties.example).
spring.config.import=optional:file:./secrets.properties

############# Database Properties ###########################################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/warehouse-application?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=ewmapp
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


####################### Mail Properties ###########################################
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

####################### Security Properties ###########################################
jwt.expiration.time=90000
SECRET_KEY=${JWT_SECRET_KEY}
allowed.origins=https://localhost:4200

#####
#
# HTTPS configuration
#
#####

# Server web port
server.port=8443

# Enable HTTPS support (only accept HTTPS requests)
server.ssl.enabled=true

# Alias that identifies the key in the key store
server.ssl.key-alias=ewmapp

# Keystore location
server.ssl.key-store=${KEYSTORE_PATH:classpath:ewmapp-keystore.p12}

# Keystore password
server.ssl.key-store-password=${KEYSTORE_PASSWORD}

# Keystore format
server.ssl.key-store-type=PKCS12

